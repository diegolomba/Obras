<style>
:root{--bg:#f3f4f5;--card:#fff;--tx:#23272b;--mut:#6e757c;--pri:#33383d;--soft:#e7e9eb;--bd:#e1e4e7;--bad:#a33a3a;--hdr:#2e3236}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
header{position:sticky;top:0;background:var(--hdr);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;justify-content:space-between;align-items:center;z-index:5}
header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:2px}
header button{background:none;color:#fff;border:0;padding:6px;display:flex;align-items:center}
header .izq{display:flex;align-items:center;gap:8px}
header select.emp{width:auto;max-width:170px;margin:0 0 0 4px;padding:5px 24px 5px 10px;font-size:13px;border-radius:9px;background-color:rgba(255,255,255,.14);color:#fff;border:0}
header select.emp option{color:#000}
header svg.ic{width:26px;height:26px}
main{padding:12px 12px calc(84px + env(safe-area-inset-bottom));max-width:900px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:8px 0 6px;font-size:10px;color:#9aa0a6;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--tx);font-weight:600}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1 1 130px;min-width:0}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input[type=date]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;text-align:left;display:block}
input:not([type=checkbox]):not([type=radio]):not([type=file]),select{min-height:44px}
td.n .m{display:flex;justify-content:space-between;gap:14px}
.homebtns{display:flex;justify-content:center;align-items:flex-start;gap:26px;margin-top:14px}
.homebtns .it{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--mut)}
.homebtns .fab{cursor:pointer}.homebtns .fab.big{width:58px;height:58px}
.bar{height:8px;background:#e3e5e7;border-radius:6px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--pri)}
.thumb{width:54px;height:54px;border-radius:8px;object-fit:cover;background:#e3e5e7;flex:0 0 auto}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;font-size:16px;background:#fff;color:var(--tx);font-family:inherit}
textarea{min-height:180px;line-height:1.4}
.btn{border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;background:var(--pri);color:#fff;cursor:pointer}
.btn.sec{background:var(--soft);color:var(--tx)}.btn.bad{background:#f4e6e6;color:var(--bad)}
.btn.sm{padding:7px 10px;font-size:13px;flex:0 0 auto}.btn.full{width:100%}.btn.lg{padding:14px;font-size:16px}
.fab{width:46px;height:46px;border-radius:50%;background:var(--pri);color:#fff;border:0;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--card);border-radius:12px;padding:10px}
.stat b{display:block;font-size:16px;margin-top:2px}.stat span{font-size:12px;color:var(--mut)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.t{font-weight:600}.s{font-size:13px;color:var(--mut);margin-top:2px}
.prev{font-size:14px;margin-top:6px;white-space:pre-wrap;color:#3d4247}
.amt{font-weight:700;white-space:nowrap;text-align:right}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;background:var(--soft);color:var(--tx);margin-right:4px}
.tag.p{background:#fff;border:1px solid var(--bd);color:var(--mut)}.tag.d{background:var(--pri);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 4px;border-bottom:1px solid var(--bd);text-align:left}
th{font-size:11px;color:var(--mut);font-weight:600}td.n,th.n{text-align:right;white-space:nowrap}
tr.tot td{border-top:2px solid var(--tx);font-weight:700}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:8px;font-size:13px;color:var(--tx)}.seg button.on{background:#fff;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-body{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 6px;font-size:18px}
.menu{background:#fff;border-radius:12px;overflow:hidden}
.menu button{display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px solid var(--bd);background:#fff;padding:15px 14px;font-size:16px;color:var(--tx);text-align:left}
.menu button:last-child{border-bottom:0}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#23272b;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:30;max-width:90%;text-align:center}
.card .item+.item{border-top:1px solid var(--bd);padding-top:8px;margin-top:8px}
.empty{text-align:center;color:var(--mut);padding:24px}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--tx);margin-top:12px}.chk input{width:22px;height:22px;flex:0 0 auto;accent-color:var(--pri)}
.h{display:flex;justify-content:space-between;align-items:center;margin:2px 0 10px;gap:8px}.h h2{font-size:16px;margin:0}
.asis{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.asis .nm{flex:1}
.neg{color:var(--bad)}
.fotos{display:flex;flex-wrap:wrap;gap:8px}
.foto{position:relative;width:96px;height:96px}
.foto img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);background:#ddd}
.foto button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:12px}
.addfoto{display:inline-flex;align-items:center;gap:8px;margin-top:8px;padding:9px 14px;border-radius:10px;background:var(--soft);color:var(--tx);font-size:14px;font-weight:600;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:11px;color:var(--mut);padding:2px 0}
.cal .d{background:#fff;border:1px solid var(--bd);border-radius:8px;min-height:54px;padding:4px 5px;font-size:13px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.cal .d .c{font-size:11px;font-weight:600;text-align:right}
.cal .d.full{background:#d9dde0;border-color:#c9ced2}.cal .d.part{background:#eef0f1}
.cal .d.hoy{outline:2px solid var(--pri);outline-offset:-1px}
.cal .d.vac{background:none;border:0;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{border:1px solid var(--bd);background:#fff;border-radius:16px;padding:7px 11px;font-size:13px;color:var(--tx)}
.chips button.on{color:#fff;background:var(--pri);border-color:var(--pri)}
.dia{padding:10px 0;border-bottom:1px solid var(--bd)}
#login{max-width:380px;margin:12vh auto;padding:20px}
.drop{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .18s}
.drop.on{opacity:1;pointer-events:auto}
.drop .panel{position:absolute;left:10px;top:calc(env(safe-area-inset-top) + 56px);width:240px;background:rgba(255,255,255,.97);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.25);overflow:hidden;transform:translateY(-14px) scale(.97);transform-origin:top left;transition:transform .2s ease}
.drop.on .panel{transform:none}
.drop .panel button{display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px solid var(--bd);background:none;padding:14px 16px;font-size:16px;color:var(--tx);text-align:left}
.drop .panel button:last-child{border-bottom:0}
.dlg{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:24px}
.dlg .box{background:#fff;border-radius:14px;padding:20px 18px 16px;width:100%;max-width:320px;text-align:center}
.dlg .box p{margin:0 0 16px;font-size:16px;font-weight:600}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.gal img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#dde0e3;border-radius:4px;cursor:pointer}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:40;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--bd)}
.task>input[type=checkbox]{width:22px;height:22px;margin-top:1px;flex:0 0 auto;accent-color:var(--pri)}
.task .tx{flex:1;cursor:pointer;min-width:0}
.task.done .tt{text-decoration:line-through;color:var(--mut)}
.meta{font-size:12px;color:var(--mut);margin-top:3px;display:flex;flex-wrap:wrap;gap:3px 10px;align-items:center}
.vencida{color:var(--bad)}
.x{border:0;background:none;color:var(--mut);font-size:16px;padding:2px 6px}
</style>
</head>
<body>

<div id="login" hidden>
  <form class="card" onsubmit="event.preventDefault();entrar()">
    <h2 style="margin-top:0">CMS</h2>
    <label>Email</label><input id="l_email" type="email" autocomplete="username" autocapitalize="off">
    <label>Password</label><input id="l_pass" type="password" autocomplete="current-password">
    <button class="btn full" style="margin-top:14px">Sign in</button>
    <div id="l_err" class="s" style="color:var(--bad);margin-top:8px"></div>
  </form>
</div>

<div id="app" hidden>
  <header>
    <div class="izq"><button onclick="menu()" aria-label="Menu" id="b_menu"></button><h1>CMS</h1><select class="emp" id="b_emp" onchange="cambiarEmp(this.value)"></select></div>
    <button onclick="recargar()" aria-label="Refresh" id="b_ref"></button>
  </header>
  <main id="view"><div class="empty">Loading…</div></main>
  <nav id="nav"></nav>
</div>

<div id="drop" class="drop" onclick="if(event.target===this)cerrarMenu()"><div class="panel" id="dropPanel"></div></div>
<div id="dlg" class="dlg" hidden></div>
<div id="lb" class="lb" hidden onclick="this.hidden=true"><img id="lbImg" alt=""></div>
<div id="sheet" class="sheet" hidden onclick="if(event.target===this)cerrar()"><div class="sheet-body" id="sheetBody"></div></div>

<script>

/* ---------- Icons ---------- */

};

document.getElementById('b_ref').innerHTML = ic('refresh');

const CATEGORIES_START = ['Materials','Labor','Subcontracts','Equipment rental','Tools','Transportation','Fuel','Electrical','Plumbing','Painting','Finishes','Permits','Admin expenses'];
const METHODS = ['Cash','Transfer','Card','Check','Credit'];
const BANKS = ['Banreservas','Banco Popular','BHD','Scotiabank','Banco Santa Cruz','Promerica','Banesco','Banco Caribe','BDI','Banco Vimenca','Banco López de Haro','Banco Lafise','Asociación Popular (APAP)','Asociación Cibao','Asociación La Nacional'];
// Daily rate per DR labor code (44 h week = 5.5 days; biweekly = 23.83/2 days)
const DIAS_PERIODO = {diario:1, semanal:5.5, quincenal:11.915, mensual:23.83};
const PAY_LBL = {diario:'Daily', semanal:'Weekly', quincenal:'Biweekly', mensual:'Monthly'};
const SAL_HINT = {diario:'Amount per day.', semanal:'Amount per week.', quincenal:'Amount per biweekly period.', mensual:'Full monthly salary. Each payment is half the month.'};
const STATUS_LBL = {activa:'Active', pausada:'Paused', terminada:'Finished'};
const ESTADOS = [['presente','Present'],['tardanza','Late'],['parcial','Partial'],['excusa','Excused'],['ausente','Absent']];
const LBL_ESTADO = Object.fromEntries(ESTADOS);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = v => Math.round((Number(v)||0)*100)/100;
const fmtN = n => Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt = n => 'RD$ ' + fmtN(n);
const fmtA = n => `<span class="m"><span>RD$</span><span>${fmtN(n)}</span></span>`;
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const hoy = () => ymd(new Date());
const sumaDias = (f,n) => { const d=new Date(f+'T12:00:00'); d.setDate(d.getDate()+n); return ymd(d); };
const fecha = f => { if(!f) return ''; const s=String(f).slice(0,10).split('-'); return `${s[2]}/${s[1]}/${s[0]}`; };
const sum = (a,f) => a.reduce((s,x)=>s+(Number(f(x))||0),0);
const num = sel => r2(parseFloat($(sel).value)||0);
const alnum = v => String(v||'').replace(/[^0-9A-Za-z]/g,'').toUpperCase();
const nomObra = id => S.obras.find(o=>o.id===id)?.nombre || '';
function ncfModo(){ $('#g_ncf').setAttribute('inputmode',$('#g_ncfp').value==='OTRO'?'text':'numeric'); $('#g_ncf').blur(); }
const conApodo = x => (x.nombre||'') + (x.apodo?` “${x.apodo}”`:'');
const nomEmp = id => S.empleados.find(e=>e.id===id)?.nombre || '';
const obraOpts = (sel, blank='') => `<option value="">${blank}</option>` + S.obras.map(o=>`<option value="${o.id}" ${o.id===sel?'selected':''}>${esc(o.nombre)}${o.estado!=='activa'?' ('+STATUS_LBL[o.estado]+')':''}</option>`).join('');

const S = {
  obras:[], gastos:[], borradores:[], notas:[], empleados:[], asistencia:[], adelantos:[], pagos:[], suplidores:[], partidas:[], tareas:[], presupuestos:[], adicionales:[], cobros:[], bobra:null,
  tab:'inicio', sub:'asistencia', db:'suplidores', listo:false,
  f:{tipo:'',obra:'',desde:'',hasta:'',q:''},
  fn:'todas', qs:'', calMes:hoy().slice(0,7), nd:sumaDias(hoy(),-6), nh:hoy(),
  fotosTmp:[], fotosDir:'', diaTmp:{}, diaF:''
};

function toast(m,ms=2600){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),ms); return t; }
function abrir(html){ $('#sheetBody').innerHTML=html; $('#sheet').hidden=false; $('#sheetBody').scrollTop=0; }
function cerrar(){ $('#sheet').hidden=true; }

/* ---------- Session ---------- */
async function entrar(){
  $('#l_err').textContent='';
  const {error} = await sb.auth.signInWithPassword({email:$('#l_email').value.trim(), password:$('#l_pass').value});
  if(error) $('#l_err').textContent = 'Could not sign in. Check your email and password.';
}
async function salir(){ cerrar(); await sb.auth.signOut(); }
sb.auth.onAuthStateChange((ev, session) => {
  if(session){
    if(!S.listo){ S.listo=true; $('#login').hidden=true; $('#app').hidden=false; setTimeout(cargar,0); }
  } else {
    S.listo=false; $('#app').hidden=true; $('#login').hidden=false;
  }
});

/* ---------- Data ---------- */
const EMPRESAS=[['diagus','Diagus Distribuidora'],['nenos','Nenos']];
const EMP_LEGAL={diagus:{n:'Diagus Distribuidora, SRL',rnc:'132-738-642'},nenos:{n:'Nenos, SRL',rnc:'101-735-295'}};
S.emp=(()=>{try{const v=localStorage.getItem('cms_emp');return EMPRESAS.some(e=>e[0]===v)?v:'diagus'}catch(e){return 'diagus'}})();
const delaEmp=x=>(x.empresa||'diagus')===S.emp;
function pintarEmp(){ const b=$('#b_emp'); if(b) b.innerHTML=EMPRESAS.map(([k,l])=>`<option value="${k}" ${k===S.emp?'selected':''}>${l}</option>`).join(''); }
async function cambiarEmp(v){ S.emp=v; try{localStorage.setItem('cms_emp',v)}catch(e){} S.f={tipo:'',obra:'',desde:'',hasta:'',q:''}; await cargar(); }
const gId=id=>S.gastos.find(x=>x.id===id)||S.borradores.find(x=>x.id===id);
const divisionDe=g=>g.division||((g.tipo==='obra'||g.obra_id)?'Constructora':'Distribuidora');
async function cargar(){
  const tablas = {obras:'obras',gastos:'gastos',notas:'notas',empleados:'empleados',asistencia:'asistencia',adelantos:'adelantos',pagos:'pagos_nomina',suplidores:'suplidores',partidas:'partidas',tareas:'tareas',presupuestos:'presupuestos',adicionales:'adicionales',cobros:'cobros'};
  const keys = Object.keys(tablas);
  const res = await Promise.all(keys.map(k => sb.from(tablas[k]).select('*').range(0,9999)));
  for(let i=0;i<keys.length;i++){
    if(res[i].error){ toast('Error loading '+tablas[keys[i]]+': '+res[i].error.message); continue; }
    S[keys[i]] = res[i].data || [];
  }
  for(const k of ['obras','gastos','notas','empleados','suplidores','partidas']) S[k]=S[k].filter(delaEmp);
  S.borradores=S.gastos.filter(g=>g.borrador); S.gastos=S.gastos.filter(g=>!g.borrador);
  const ide=new Set(S.empleados.map(e=>e.id)), idn=new Set(S.notas.map(n=>n.id));
  for(const k of ['asistencia','adelantos','pagos']) S[k]=S[k].filter(x=>ide.has(x.empleado_id));
  S.tareas=S.tareas.filter(x=>idn.has(x.nota_id));
  const ido=new Set(S.obras.map(o=>o.id));
  for(const k of ['presupuestos','adicionales','cobros']) S[k]=S[k].filter(x=>ido.has(x.obra_id));
  S.adicionales.sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
  S.cobros.sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
  pintarEmp();
  S.obras.sort((a,b)=>(a.estado==='activa'?0:1)-(b.estado==='activa'?0:1) || a.nombre.localeCompare(b.nombre));
  S.gastos.sort((a,b)=>b.fecha.localeCompare(a.fecha) || String(b.creado).localeCompare(String(a.creado)));
  S.empleados.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  S.suplidores.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  S.partidas.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  S.pagos.sort((a,b)=>String(b.fecha_pago).localeCompare(String(a.fecha_pago)));
  render();
}

const b64 = blob => new Promise((ok,mal)=>{const r=new FileReader(); r.onload=()=>ok(String(r.result).split(',')[1]); r.onerror=mal; r.readAsDataURL(blob);});
async function escanearFactura(input){

    if(error) throw error;

function montosDe(d){
  const n=x=>{const v=parseFloat(x); return isFinite(v)&&v>0?v:0;};
  let sin=n(d.subtotal), it=n(d.itbis), pr=n(d.propina), tot=n(d.total);
  if(sin){ if(!tot) tot=r2(sin+it+pr); }
  else if(tot){ const ti=it>0?0.18:0, tp=pr>0?0.10:0; sin=r2(tot/(1+ti+tp)); it=ti?r2(sin*ti):0; pr=tp?r2(tot-sin-it):0; }
  return {sin:r2(sin),it:r2(it),pr:r2(pr),tot:r2(tot)};
}
async function escanearHome(input){ formGasto(); await escanearFactura(input); }
async function borradorDe(f){
  const blob=await reducir(f);
  const path=`facturas/${crypto.randomUUID()}.jpg`;
  const up=await sb.storage.from(BUCKET).upload(path,blob,{contentType:'image/jpeg'});
  if(up.error) throw up.error;
  let d={}, ok=true;
  try{
    const small=await reducir(f,1200,0.7);
    const lim=new Promise((_,mal)=>setTimeout(()=>mal(new Error('Timed out')),60000));
    const r=await Promise.race([sb.functions.invoke('scan-invoice',{body:{image:await b64(small),media_type:'image/jpeg'}}),lim]);
    if(r.error||!r.data||r.data.error) throw new Error('scan');
    d=r.data;
  }catch(e){ ok=false; d={}; }
  const m=montosDe(d), rnc=String(d.rnc||'').replace(/[^0-9]/g,''), nom=String(d.suplidor||'').trim();
  const s=S.suplidores.find(x=>rnc&&String(x.documento||'').replace(/[^0-9]/g,'')===rnc)||S.suplidores.find(x=>nom&&x.nombre.toLowerCase()===nom.toLowerCase());
  let ds=String(d.descripcion||'').trim(); if(ds.length>40) ds=ds.slice(0,40).replace(/\s+\S*$/,'');
  const row={fecha:/^\d{4}-\d{2}-\d{2}$/.test(d.fecha||'')?d.fecha:hoy(), tipo:'obra', obra_id:null, descripcion:ds,
    suplidor:s?s.nombre:nom, suplidor_id:s?s.id:null, rnc:s?(String(s.documento||'').replace(/[^A-Za-z0-9]/g,'')||rnc):rnc,
    ncf:String(d.ncf||'').toUpperCase().replace(/[^A-Z0-9]/g,''), partida:'', metodo_pago:'',
    monto_sin_itbis:m.sin, itbis:m.it, propina:m.pr, monto_total:m.tot, fotos:[path], borrador:true, empresa:S.emp,
    division:S.emp==='diagus'?'Constructora':null};
  const {error}=await sb.from('gastos').insert(row);
  if(error) throw error;
  return ok;
}
async function escanearVarias(input){
  const files=[...input.files]; input.value=''; if(!files.length) return;
  let hechas=0, fallidas=0, i=0;
  const pintar=()=>abrir(`<h2>Scanning invoices</h2><div class="s">${hechas} of ${files.length} done${fallidas?` · ${fallidas} could not be read`:''}</div><div class="bar"><i style="width:${Math.round(hechas/files.length*100)}%"></i></div><div class="s" style="margin-top:10px">Keep this screen open until it finishes.</div>`);
  pintar();
  const worker=async()=>{ while(i<files.length){ const f=files[i++]; try{ if(!(await borradorDe(f))) fallidas++; }catch(e){ fallidas++; } hechas++; pintar(); } };
  await Promise.all([worker(),worker()]);
  await cargar();
  abrirBorradores();
}

  const urlDe={}; paths.forEach((pp,k)=>{ urlDe[pp]=data?.[k]?.signedUrl||''; });

function llenarGasto(d){
  const set=(id,v)=>{ const el=$(id); if(v!==null&&v!==undefined&&v!==''){ el.value=v; el.style.outline=''; } else if(!el.value) el.style.outline='2px solid #d9a400'; };
  if(/^\d{4}-\d{2}-\d{2}$/.test(d.fecha||'')) set('#g_fecha',d.fecha); else $('#g_fecha').style.outline='2px solid #d9a400';
  if(d.descripcion && !$('#g_desc').value){ let ds=String(d.descripcion).trim(); if(ds.length>40) ds=ds.slice(0,40).replace(/\s+\S*$/,''); $('#g_desc').value=ds; }
  const rnc=String(d.rnc||'').replace(/[^0-9]/g,'');
  const nom=String(d.suplidor||'').trim().toLowerCase();
  const s=S.suplidores.find(x=>rnc&&String(x.documento||'').replace(/[^0-9]/g,'')===rnc) || S.suplidores.find(x=>nom&&x.nombre.toLowerCase()===nom);
  if(s){ $('#g_supid').value=s.id; elegirSup(); }
  else if(d.suplidor||rnc){ $('#g_supid').value='otro'; $('#g_sup').hidden=false; $('#g_sup').value=d.suplidor||''; $('#g_rnc').value=rnc; }
  if(rnc && s && !$('#g_rnc').value) $('#g_rnc').value=rnc;
  if(!$('#g_rnc').value) $('#g_rnc').style.outline='2px solid #d9a400'; else $('#g_rnc').style.outline='';
  const ncf=String(d.ncf||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const m=ncf.match(/^([A-Z]\d{2})(\d+)$/);
  if(m && [...$('#g_ncfp').options].some(o=>o.value===m[1])){ $('#g_ncfp').value=m[1]; $('#g_ncf').value=m[2]; $('#g_ncf').style.outline=''; }
  else if(ncf){ $('#g_ncfp').value='OTRO'; ncfModo(); $('#g_ncf').value=ncf; }
  else $('#g_ncf').style.outline='2px solid #d9a400';
  const n=x=>{const v=parseFloat(x); return isFinite(v)&&v>0?v:0;};
  const tot=n(d.total), sin=n(d.subtotal), it=n(d.itbis), pr=n(d.propina);
  $('#g_lleva').checked=it>0; $('#g_llevap').checked=pr>0;
  if(sin){ $('#g_sin').value=r2(sin); $('#g_itbis').value=it?r2(it):''; $('#g_prop').value=pr?r2(pr):''; $('#g_tot').value=tot?r2(tot):r2(sin+it+pr); }
  else if(tot){ if(!it&&!pr){ $('#g_lleva').checked=false; } $('#g_tot').value=r2(tot); calc('tot'); }
  if(!$('#g_tot').value) $('#g_tot').style.outline='2px solid #d9a400'; else $('#g_tot').style.outline='';
}
function elegirSup(){
  const v=$('#g_supid').value;
  $('#g_sup').hidden = v!=='otro';
  if(v==='otro'){ $('#g_sup').value=''; $('#g_rnc').value=''; $('#g_sup').focus(); return; }
  const s=S.suplidores.find(x=>x.id===v);
  $('#g_sup').value = s ? s.nombre : '';
  $('#g_rnc').value = s ? (s.documento||'') : '';
}
function calc(src){
  const ti=$('#g_lleva').checked?0.18:0, tp=$('#g_llevap').checked?0.10:0;
  const v=id=>parseFloat($(id).value)||0;
  const sin=v('#g_sin'), it=v('#g_itbis'), pr=v('#g_prop'), tot=v('#g_tot'), ex=v('#g_exe')+v('#g_isc')+v('#g_cdt');
  if(src==='tot'){
    if(!tot){ ['#g_sin','#g_itbis','#g_prop'].forEach(i=>$(i).value=''); return; }
    const base=Math.max(0,tot-ex);
    const s=r2(base/(1+ti+tp)), i=r2(s*ti), p=r2(base-s-i);
    $('#g_sin').value=s; $('#g_itbis').value=ti?i:''; $('#g_prop').value=tp?p:'';
  } else if(src==='ajuste'){
    $('#g_tot').value=(sin||it||pr||ex)?r2(sin+it+pr+ex):'';
  } else {
    if(!sin){ ['#g_itbis','#g_prop'].forEach(i=>$(i).value=''); $('#g_tot').value=ex?r2(ex):''; return; }
    const i=r2(sin*ti), p=r2(sin*tp);
    $('#g_itbis').value=ti?i:''; $('#g_prop').value=tp?p:''; $('#g_tot').value=r2(sin+i+p+ex);
  }
}
async function guardarGasto(id){
  const tipo=$('#g_tipo').value, supid=$('#g_supid').value;
  const d={fecha:$('#g_fecha').value||hoy(), tipo, obra_id:tipo==='obra'?($('#g_obra').value||null):null,
    descripcion:$('#g_desc').value.trim(), suplidor:$('#g_sup').value.trim(), division:S.emp==='diagus'?$('#g_div').value:null,
    suplidor_id:(supid&&supid!=='otro')?supid:null, rnc:alnum($('#g_rnc').value),
    ncf:(()=>{if($('#g_ncfp').value==='OTRO')return $('#g_ncf').value.trim().toUpperCase();const n=$('#g_ncf').value.replace(/[^0-9]/g,'');return n?$('#g_ncfp').value+n:''})(), partida:$('#g_part').value,
    monto_sin_itbis:num('#g_sin'), itbis:num('#g_itbis'), propina:num('#g_prop'), exento:num('#g_exe'), isc:num('#g_isc'), cdt:num('#g_cdt'), monto_total:num('#g_tot'), metodo_pago:$('#g_met').value,
    fotos:S.fotosTmp};
  if(!d.monto_total) return toast('Enter the net or gross amount');
  if(d.ncf){ const dup=S.gastos.find(g=>g.id!==id&&g.ncf===d.ncf&&(g.rnc||'')===d.rnc);
    if(dup && !confirm(`An expense with this NCF and RNC already exists (${fecha(dup.fecha)}, ${dup.suplidor||''}, ${fmt(dup.monto_total)}). Save anyway?`)) return; }
  { const nm=(d.suplidor||'').toLowerCase();
    const dup2=S.gastos.find(g=>g.id!==id&&g.fecha===d.fecha&&r2(g.monto_total)===r2(d.monto_total)&&((d.suplidor_id&&g.suplidor_id===d.suplidor_id)||(nm&&(g.suplidor||'').toLowerCase()===nm)));
    if(dup2 && !confirm(`This looks like a repeated invoice: same supplier, date and amount (${dup2.suplidor||''}, ${fecha(dup2.fecha)}, ${fmt(dup2.monto_total)}). Save anyway?`)) return; }
  if(!d.suplidor_id && d.rnc && d.suplidor && !S.suplidores.some(x=>alnum(x.documento)===d.rnc)){

      if(e2) toast('Could not add the supplier: '+e2.message); else d.suplidor_id=ns.id;
    }
  }
  const eraBorr=!!gId(id)?.borrador; d.borrador=false;
  await limpiarFotos(gId(id)?.fotos, d.fotos);
  await guardar('gastos',id,d);

async function borrarGasto(id){

const factorDia = a => { const e=estadoDe(a); return (e==='presente'||e==='tardanza')?1 : e==='parcial'?0.5 : e==='excusa'?(a.excusa_pagada?1:0) : 0; };

const tarifaDiaria = e => r2((Number(e.sueldo)||0)/(DIAS_PERIODO[e.tipo_sueldo]||1));
const pendAdel = id => sum(S.adelantos.filter(a=>a.empleado_id===id&&!a.descontado),a=>a.monto);

function mesCal(k){ const [y,m]=S.calMes.split('-').map(Number); S.calMes=ymd(new Date(y,m-1+k,1)).slice(0,7); render(); }
function abrirDia(f){

async function guardarDia(){
  const ups=[], dels=[];
  for(const [eid,t] of Object.entries(S.diaTmp)){
    if(!t.estado){ if(t.id) dels.push(t.id); continue; }
    const pag=t.estado==='excusa'&&t.pag, conHE=t.estado==='presente'||t.estado==='tardanza';
    ups.push({empleado_id:eid, fecha:S.diaF, estado:t.estado, presente:['presente','tardanza','parcial'].includes(t.estado)||pag,
      horas_extra:conHE?r2(t.he):0, excusa_pagada:pag, motivo:t.estado==='excusa'?(t.motivo.trim()||null):null, obra_id:null});
  }
  if(ups.length){ const {error}=await sb.from('asistencia').upsert(ups,{onConflict:'empleado_id,fecha'}); if(error) return toast('Error: '+error.message); }
  if(dels.length){ const {error}=await sb.from('asistencia').delete().in('id',dels); if(error) return toast('Error: '+error.message); }
  cerrar(); await cargar(); toast('Attendance saved');

function calcNomina(){
  return S.empleados.map(e=>{
    const as=S.asistencia.filter(a=>a.empleado_id===e.id&&a.fecha>=S.nd&&a.fecha<=S.nh);
    const he=sum(as.filter(a=>['presente','tardanza'].includes(estadoDe(a))),a=>a.horas_extra), td=tarifaDiaria(e);
    const ad=pendAdel(e.id);
    const ya=S.pagos.find(p=>p.empleado_id===e.id&&p.desde===S.nd&&p.hasta===S.nh);
    if(e.tipo_sueldo==='mensual'){
      const faltas=sum(as,a=>1-factorDia(a));
      const bruto=r2(Math.max(0,(Number(e.sueldo)||0)/2 - faltas*td) + he*(td/8)*1.35);
      return {e,mensual:true,faltas,dias:null,he,td,bruto,ad,neto:r2(bruto-ad),ya};
    }
    const dias=sum(as,factorDia);
    const bruto=r2(dias*td + he*(td/8)*1.35);
    return {e,dias,he,td,bruto,ad,neto:r2(bruto-ad),ya};
  }).filter(x=>x.dias>0||x.ya||(x.mensual&&x.e.activo));
}

async function pagar(eid){

async function marcarTarea(id,val){

  else { const p=S.tareas.find(x=>x.id===t.parent_id);
    if(p){ const todas=subsDe(p.id).every(s=>s.id===id?val:s.hecho); if(p.hecho!==todas) cambios.push({id:p.id,hecho:todas}); } }
  for(const c of cambios){
    const {error}=await sb.from('tareas').update({hecho:c.hecho}).eq('id',c.id);

    S.tareas.find(x=>x.id===c.id).hecho=c.hecho;

const bloqueFotos = () => `<label>Photos</label><div id="s_fotos" class="fotos"></div>
  <label class="addfoto">${ic('camera',20)} Add photo<input type="file" accept="image/*" multiple hidden onchange="subirFotos(this)"></label>
  <span id="s_subiendo" class="s"></span>`;
async function pintarFotos(){
  const box=$('#s_fotos'); if(!box) return;
  if(!S.fotosTmp.length){ box.innerHTML='<div class="s">No photos</div>'; return; }
  const {data}=await sb.storage.from(BUCKET).createSignedUrls(S.fotosTmp,3600);
  box.innerHTML=S.fotosTmp.map((p,i)=>{const u=data?.[i]?.signedUrl||'';
    return `<div class="foto"><a href="${u}" target="_blank" rel="noopener"><img src="${u}" alt="photo"></a><button onclick="quitarFoto(${i})">✕</button></div>`}).join('');
}
function reducir(file,max=1600,q=0.82){
  return new Promise((ok,mal)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      c.toBlob(b=>b?ok(b):mal(new Error('Could not process the photo')),'image/jpeg',q);};
    img.onerror=()=>{URL.revokeObjectURL(url); mal(new Error('Unsupported photo format'));};
    img.src=url;
  });
}
async function subirFotos(input){
  const files=[...input.files]; input.value='';
  for(const f of files){
    $('#s_subiendo').textContent=' Uploading…';
    try{
      const blob=await reducir(f);
      const path=`${S.fotosDir}${crypto.randomUUID()}.jpg`;
      const {error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:'image/jpeg'});
      if(error) throw error;
      S.fotosTmp.push(path);
    }catch(e){ toast('Photo upload error: '+e.message); }
  }
  $('#s_subiendo').textContent=' Remember to tap Save.';
  pintarFotos();
}
function quitarFoto(i){ S.fotosTmp.splice(i,1); pintarFotos(); }

  const quitar=(viejas||[]).filter(p=>!nuevas.includes(p));
  if(quitar.length) await sb.storage.from(BUCKET).remove(quitar);
}

const presObra=id=>S.presupuestos.filter(p=>p.obra_id===id);

function resObra(o){
  const base=sum(presObra(o.id),p=>p.monto), adic=sum(adicObra(o.id),a=>a.monto);
  const total=r2(base+adic), gast=gastoObra(o.id), cob=sum(cobrObra(o.id),c=>c.monto);
  return {base,adic,total,gast,cob,pct:total>0?gast/total*100:(gast>0?101:0)};
}
const colorPct=p=>p>100?'#d9534f':p>=80?'#e09a1a':'#2f9e8a';
const gradPct=p=>p>100?'linear-gradient(90deg,#ffb3ab,#e5534b)':p>=80?'linear-gradient(90deg,#ffe08a,#f5a623)':'linear-gradient(90deg,#9be0c4,#3fb6a0)';

const pctTxt=r=>r.total>0?Math.round(r.pct)+'%':'—';
const ordenObras=(fin)=>S.obras.filter(o=>fin||o.estado!=='terminada').sort((a,b)=>({activa:0,pausada:1,terminada:2}[a.estado]??1)-({activa:0,pausada:1,terminada:2}[b.estado]??1)||a.nombre.localeCompare(b.nombre));

/* ---------- Export ---------- */
const enRango = (f,d1,d2) => !!f && (!d1||f>=d1) && (!d2||f<=d2);
const slug = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,30) || 'expense';
function nombresFotos(gs){
  const map={};
  gs.forEach(g=>{ (g.fotos||[]).forEach((p,i)=>{ (map[g.id]=map[g.id]||[]).push(`${g.fecha}_${slug(g.suplidor||g.descripcion)}_${String(g.id).slice(0,4)}${g.fotos.length>1?'_'+(i+1):''}.jpg`); }); });
  return map;
}
const PAY_ES={diario:'Diario',semanal:'Semanal',quincenal:'Quincenal',mensual:'Mensual'};
const STATUS_ES={activa:'Activo',pausada:'Pausado',terminada:'Terminado'};
const ESTADO_ES={presente:'Presente',tardanza:'Tardanza',parcial:'Parcial',excusa:'Excusa',ausente:'Ausente'};
function dsGastos(gs, fotosMap, modo){
  gs=gs.slice().sort((a,b)=>a.fecha.localeCompare(b.fecha));
  if(modo==='acc'){
    const h=['NCF','Fecha','Descripción','Suplidor','RNC','Subtotal','ITBIS pagado','Exento','ISC 10%','CDT 2%','Propina legal','Total'];
    if(fotosMap) h.push('Fotos de facturas');
    return {t:'Contabilidad', h,
      rows:gs.map(g=>{ const r=[g.ncf||'',fecha(g.fecha),g.descripcion||'',g.suplidor||'',g.rnc||'',r2(g.monto_sin_itbis),r2(g.itbis),r2(g.exento),r2(g.isc),r2(g.cdt),r2(g.propina),r2(g.monto_total)];
        if(fotosMap) r.push((fotosMap[g.id]||[]).join(', ')); return r; }),
      num:[5,6,7,8,9,10,11], sum:[5,6,7,8,9,10,11], gastos:gs};
  }
  const h=['Fecha','Tipo','Proyecto','Descripción','Suplidor','RNC / Cédula','NCF','Categoría','Neto','ITBIS','Exento','ISC 10%','CDT 2%','Propina','Bruto','Método de pago'];
  if(fotosMap) h.push('Fotos de facturas');
  return {t:'Gastos', h,
    rows:gs.map(g=>{ const r=[fecha(g.fecha),g.tipo==='obra'?'Proyecto':'Personal',g.tipo==='obra'?nomObra(g.obra_id):'Personal',g.descripcion||'',g.suplidor||'',g.rnc||'',g.ncf||'',g.partida||'',r2(g.monto_sin_itbis),r2(g.itbis),r2(g.exento),r2(g.isc),r2(g.cdt),r2(g.propina),r2(g.monto_total),g.metodo_pago||''];
      if(fotosMap) r.push((fotosMap[g.id]||[]).join(', ')); return r; }),
    num:[8,9,10,11,12,13,14], sum:[8,9,10,11,12,13,14], pdf:[0,4,2,3,7,6,8,9,13,14], gastos:gs};
}
function dsGastosDiv(gs,fotosMap,modo){
  if(S.emp!=='diagus') return [dsGastos(gs,fotosMap,modo)];
  const r=['Constructora','Distribuidora'].map(dv=>{ const ds=dsGastos(gs.filter(g=>divisionDe(g)===dv),fotosMap,modo); ds.t=dv; return ds; }).filter(ds=>ds.rows.length);
  return r.length?r:[dsGastos(gs,fotosMap,modo)];
}
function dsResumen(d1,d2){
  const gs=S.gastos.filter(g=>enRango(g.fecha,d1,d2));
  const rows=S.obras.map(o=>[o.nombre,r2(sum(gs.filter(g=>g.obra_id===o.id),g=>g.monto_total))]).filter(r=>r[1]);
  const sinObra=sum(gs.filter(g=>g.tipo==='obra'&&!g.obra_id),g=>g.monto_total); if(sinObra) rows.push(['Sin proyecto asignado',r2(sinObra)]);
  rows.push(['Personal',r2(sum(gs.filter(g=>g.tipo==='personal'),g=>g.monto_total))]);
  rows.push(['Nómina',r2(sum(S.pagos.filter(p=>enRango(p.fecha_pago,d1,d2)),p=>p.neto))]);
  return {t:'Balance', h:['Concepto','Monto'], rows, num:[1], sum:[1]};
}
function dsNomina(d1,d2){
  const ps=S.pagos.filter(p=>enRango(p.fecha_pago,d1,d2)).sort((a,b)=>String(a.fecha_pago).localeCompare(String(b.fecha_pago)));
  return {t:'Nómina', h:['Fecha de pago','Empleado','Desde','Hasta','Días','Antes de adelantos','Adelantos','Pagado'],
    rows:ps.map(p=>[fecha(p.fecha_pago),nomEmp(p.empleado_id),fecha(p.desde),fecha(p.hasta),Number(p.dias_trabajados)||0,r2(p.bruto),r2(p.descuentos),r2(p.neto)]),
    num:[5,6,7], sum:[5,6,7]};
}
function dsAsistencia(d1,d2){
  const as=S.asistencia.filter(a=>enRango(a.fecha,d1,d2)).sort((a,b)=>a.fecha.localeCompare(b.fecha)||nomEmp(a.empleado_id).localeCompare(nomEmp(b.empleado_id)));
  const emps=S.empleados.filter(e=>as.some(a=>a.empleado_id===e.id));
  const cnt=(rs,k)=>rs.filter(a=>estadoDe(a)===k).length;
  return [
    {t:'Resumen de asistencia', h:['Empleado','Presente','Tardanza','Parcial','Excusa (pagada)','Excusa (no pagada)','Ausente','Días a pagar'],
      rows:emps.map(e=>{const rs=as.filter(a=>a.empleado_id===e.id);
        return [e.nombre,cnt(rs,'presente'),cnt(rs,'tardanza'),cnt(rs,'parcial'),rs.filter(a=>estadoDe(a)==='excusa'&&a.excusa_pagada).length,rs.filter(a=>estadoDe(a)==='excusa'&&!a.excusa_pagada).length,cnt(rs,'ausente'),sum(rs,factorDia)];})},
    {t:'Detalle de asistencia', h:['Fecha','Empleado','Estado','Horas extra','Excusa pagada','Motivo'],
      rows:as.map(a=>{const e=estadoDe(a);return [fecha(a.fecha),nomEmp(a.empleado_id),ESTADO_ES[e]||e,Number(a.horas_extra)||0,e==='excusa'?(a.excusa_pagada?'Sí':'No'):'',a.motivo||''];})}
  ];
}
function dsEmpleados(){
  return {t:'Empleados', h:['Nombre','Cédula / Pasaporte','Teléfono','Puesto','Tipo de pago','Sueldo','Activo','Adelantos pendientes'],
    rows:S.empleados.map(e=>[e.nombre,e.cedula||'',e.telefono||'',e.puesto||'',PAY_ES[e.tipo_sueldo]||e.tipo_sueldo,r2(e.sueldo),e.activo?'Sí':'No',r2(pendAdel(e.id))]), num:[5,7]};
}
function dsSuplidores(){
  return {t:'Suplidores', h:['Nombre','Tipo','Profesión','RNC / Cédula','Teléfono','Correo','Dirección','Banco','Cuenta','Notas'],
    rows:S.suplidores.map(s=>[s.nombre,s.tipo==='empresa'?'Empresa':'Particular',s.tipo==='particular'?(s.profesion||''):'',s.documento||'',s.telefono||'',s.correo||'',s.direccion||'',s.banco||'',s.cuenta_banco||'',s.notas||'']),
    pdf:[0,1,2,3,4,5,7,8]};
}
function dsObras(d1,d2){
  const gs=S.gastos.filter(g=>enRango(g.fecha,d1,d2));
  return {t:'Proyectos', h:['Proyecto','Cliente','Dirección','Estado','Gastos en el período'],
    rows:S.obras.map(o=>[o.nombre,o.cliente||'',o.direccion||'',STATUS_ES[o.estado]||o.estado,r2(sum(gs.filter(g=>g.obra_id===o.id),g=>g.monto_total))]), num:[4], sum:[4]};
}
function dsNotas(d1,d2){
  const ns=S.notas.filter(n=>enRango(String(n.creado).slice(0,10),d1,d2)).sort((a,b)=>String(a.creado).localeCompare(String(b.creado)));
  return {t:'TTD', h:['Fecha','Proyecto','Título','Notas','Tareas'], rows:ns.map(n=>[fecha(n.creado),nomObra(n.obra_id)||'General',n.titulo||'',n.contenido||'',
    tareasDe(n.id).map(t=>`[${t.hecho?'x':' '}] ${t.texto}${t.encargado?' ('+t.encargado+')':''}${t.fecha_limite?' vence '+fecha(t.fecha_limite):''}`).join('; ')])};
}
const EXPORTABLES=[['resumen','Balance'],['gastos','Expenses'],['nomina','Payroll payments'],['asistencia','Attendance'],['obras','Projects'],['empleados','Employees'],['suplidores','Suppliers'],['notas','TTD']];
function pantallaExport(){
  const m=hoy().slice(0,7);
  abrir(`<h2>Export</h2>
  <div class="row">
    <div><label>From</label><input type="date" id="x_d1" value="${m}-01"></div>
    <div><label>To</label><input type="date" id="x_d2" value="${hoy()}"></div>
  </div>
  <div class="chips"><button onclick="rango('mes')">This month</button><button onclick="rango('pasado')">Last month</button><button onclick="rango('anio')">This year</button><button onclick="rango('todo')">All</button></div>
  <label style="margin-top:14px">What do you want to export?</label>
  ${EXPORTABLES.map(([k,l])=>`<label class="chk"><input type="checkbox" id="x_${k}" ${['resumen','gastos'].includes(k)?'checked':''}> ${l}</label>`).join('')}
  <div class="s" style="margin-top:10px">Employees and suppliers are exported in full; everything else follows the dates. If you include invoice photos, the PDF adds one page per invoice and Excel comes in a ZIP with the photos.</div>
  <div class="row" style="margin-top:16px">
    <button class="btn" onclick="exportarMenu('pdf')">PDF · Internal</button>
    <button class="btn" onclick="exportarMenu('xlsx')">Excel · Internal</button>
  </div>
  <div class="row" style="margin-top:10px">
    <button class="btn sec" onclick="exportarMenu('pdf','acc')">PDF · Accounting</button>
    <button class="btn sec" onclick="exportarMenu('xlsx','acc')">Excel · Accounting</button>
  </div>
  <div class="s" style="margin-top:6px">Accounting exports only the expense table (NCF, date, description, supplier, RNC, subtotal, ITBIS, exempt, ISC, CDT, tip, total).</div>
  <button class="btn sec full lg" style="margin-top:10px" onclick="cerrar()">Cancel</button>`);
}
function rango(k){
  const d=new Date(); let a='', b='';
  if(k==='mes'){ a=ymd(new Date(d.getFullYear(),d.getMonth(),1)); b=hoy(); }
  if(k==='pasado'){ a=ymd(new Date(d.getFullYear(),d.getMonth()-1,1)); b=ymd(new Date(d.getFullYear(),d.getMonth(),0)); }
  if(k==='anio'){ a=d.getFullYear()+'-01-01'; b=hoy(); }
  $('#x_d1').value=a; $('#x_d2').value=b;
}
function textoPeriodo(d1,d2){ return (d1||d2) ? `Período: ${d1?fecha(d1):'inicio'} - ${d2?fecha(d2):'hoy'}` : 'Todo el historial'; }
const MESES_ES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function nombreArchivo(d1,d2,modo,fechas){
  const fs=(fechas||[]).filter(Boolean).sort();
  const a=d1||fs[0]||hoy(), b=d2||fs[fs.length-1]||hoy();
  const [ya,ma]=a.split('-').map(Number), [yb,mb]=b.split('-').map(Number);
  let per;
  if(ya===yb&&ma===mb) per=`${MESES_ES[ma-1]} ${ya}`;
  else if(ya===yb) per=`${MESES_ES[ma-1]}-${MESES_ES[mb-1]} ${ya}`;
  else per=`${MESES_ES[ma-1]} ${ya}-${MESES_ES[mb-1]} ${yb}`;
  return `${S.emp==='nenos'?'Nenos':'Diagus Distribuidora'} - ${per} - ${modo==='acc'?'Contabilidad':'Interno'}`;
}
async function exportarMenu(formato,modo){
  const d1=$('#x_d1').value, d2=$('#x_d2').value;
  const sel=Object.fromEntries(EXPORTABLES.map(([k])=>[k,modo==='acc'?k==='gastos':$('#x_'+k).checked]));
  let conFotos=false;
  if(sel.gastos && S.gastos.some(g=>enRango(g.fecha,d1,d2)&&g.fotos?.length)){ const r=await preguntar('Include invoice photos?'); if(r===null) return; conFotos=r; }
  const gs=S.gastos.filter(g=>enRango(g.fecha,d1,d2));
  const fotosMap=(conFotos&&sel.gastos&&formato==='xlsx')?nombresFotos(gs):null;
  const dss=[];
  if(sel.resumen) dss.push(dsResumen(d1,d2));
  if(sel.gastos) dss.push(...dsGastosDiv(gs,fotosMap,modo));
  if(sel.nomina) dss.push(dsNomina(d1,d2));
  if(sel.asistencia) dss.push(...dsAsistencia(d1,d2));
  if(sel.obras) dss.push(dsObras(d1,d2));
  if(sel.empleados) dss.push(dsEmpleados());
  if(sel.suplidores) dss.push(dsSuplidores());
  if(sel.notas) dss.push(dsNotas(d1,d2));
  if(!dss.length) return toast('Select at least one item to export');
  const nombre=nombreArchivo(d1,d2,modo,gs.map(g=>g.fecha));
  const fotosDe = (conFotos&&sel.gastos) ? gs : [];
  if(formato==='pdf') await crearPDF(dss,modo==='acc'?'Reporte de contabilidad':'Reporte',textoPeriodo(d1,d2),nombre+'.pdf',fotosDe);
  else await crearExcel(dss,nombre,fotosDe,fotosMap,(modo==='acc'?'Reporte de contabilidad':'Reporte')+'   |   '+textoPeriodo(d1,d2));
  cerrar();
}
async function exportarFiltrado(formato,modo){
  const gs=gastosFiltrados();
  if(!gs.length) return toast('No expenses to export');
  let conFotos=false;
  if(gs.some(g=>g.fotos?.length)){ const r=await preguntar('Include invoice photos?'); if(r===null) return; conFotos=r; }
  const f=S.f, partes=[];
  if(f.tipo) partes.push(f.tipo==='obra'?'Gastos de proyectos':'Gastos personales');
  if(f.obra) partes.push('Proyecto: '+nomObra(f.obra));
  if(f.desde||f.hasta) partes.push(textoPeriodo(f.desde,f.hasta));
  if(f.q) partes.push('Búsqueda: '+f.q);
  const nombre=nombreArchivo(f.desde,f.hasta,modo,gs.map(g=>g.fecha));
  const fotosMap=(conFotos&&formato==='xlsx')?nombresFotos(gs):null;
  if(formato==='pdf') await crearPDF(dsGastosDiv(gs,null,modo),modo==='acc'?'Reporte de contabilidad':'Reporte de gastos',partes.join('   |   ')||'Todos los gastos',nombre+'.pdf',conFotos?gs:[]);
  else await crearExcel(dsGastosDiv(gs,fotosMap,modo),nombre,conFotos?gs:[],fotosMap,(modo==='acc'?'Reporte de contabilidad':'Reporte de gastos')+'   |   '+(partes.join('   |   ')||'Todos los gastos'));
}
const MONEY_FMT='_("RD$"* #,##0.00_);_("RD$"* (#,##0.00);_("RD$"* "-"??_);_(@_)';
async function crearExcel(dss,nombre,gastosFotos,fotosMap,sub){
  const wb=XLSX.utils.book_new();
  for(const ds of dss){
    const L=EMP_LEGAL[S.emp];
    const aoa=[[`${L.n}   |   RNC ${L.rnc}`],[sub||''],[],ds.h,...ds.rows];
    if(ds.sum&&ds.rows.length) aoa.push(ds.h.map((_,i)=> i===0 ? 'Total' : ds.sum.includes(i) ? r2(sum(ds.rows,r=>r[i])) : ''));
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    (ds.num||[]).forEach(c=>{ for(let r=4;r<aoa.length;r++){ const cell=ws[XLSX.utils.encode_cell({r,c})]; if(cell&&typeof cell.v==='number') cell.z=MONEY_FMT; } });
    ws['!cols']=ds.h.map((k,i)=>({wch:Math.min(45,Math.max(...aoa.slice(3).map(r=>String(r[i]??'').length))+ ((ds.num||[]).includes(i)?10:2))}));
    XLSX.utils.book_append_sheet(wb,ws,ds.t.slice(0,31));
  }
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  const conFotos=(gastosFotos||[]).filter(g=>g.fotos?.length);
  if(!conFotos.length){
    if(gastosFotos?.length) toast('No invoice photos in these expenses');
    return descargar(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),nombre+'.xlsx');
  }
  if(!window.JSZip) return toast('Could not load the ZIP tool. Check your connection.');
  const aviso=toast('Preparing photos…',60000);
  const zip=new JSZip();
  zip.file(nombre+'.xlsx',buf);
  const carpeta=zip.folder('Invoices');
  for(const g of conFotos){
    for(let i=0;i<g.fotos.length;i++){
      const {data,error}=await sb.storage.from(BUCKET).download(g.fotos[i]);
      if(!error&&data) carpeta.file(fotosMap[g.id][i],data);
    }
  }
  const blob=await zip.generateAsync({type:'blob'});
  aviso.remove();
  await descargar(new Blob([blob],{type:'application/zip'}),nombre+'.zip');
}
const blobADataURL = b => new Promise(ok=>{ const r=new FileReader(); r.onload=()=>ok(r.result); r.readAsDataURL(b); });
const medidas = src => new Promise(ok=>{ const i=new Image(); i.onload=()=>ok({w:i.width,h:i.height}); i.onerror=()=>ok(null); i.src=src; });
async function crearPDF(dss,titulo,sub,nombre,gastosFotos){
  if(!window.jspdf) return toast('Could not load the PDF tool. Check your connection.');
  const doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'letter'});
  const alto=doc.internal.pageSize.getHeight(), ancho=doc.internal.pageSize.getWidth();
  const LG=EMP_LEGAL[S.emp];
  doc.setFontSize(14); doc.text(`${LG.n}   |   RNC ${LG.rnc}`,14,14);
  doc.setFontSize(10); doc.text(titulo,14,20);
  doc.setFontSize(9); doc.text(sub+'   |   Generado el '+fecha(hoy()),14,25.5);
  let y=33;
  for(const ds of dss){
    const cols=ds.pdf||ds.h.map((_,i)=>i), nums=ds.num||[];
    if(y>alto-40){ doc.addPage(); y=16; }
    doc.setFontSize(11); doc.text(`${ds.t} (${ds.rows.length})`,14,y);
    const FS=cols.length>9?6.5:7;
    const cel=(v,i)=>nums.includes(i)?fmtN(v):String(v??'');
    const colStyles={}; cols.forEach((i,j)=>{ if(nums.includes(i)) colStyles[j]={halign:'right',cellPadding:{top:1.5,bottom:1.5,left:9,right:1.5}}; });
    doc.autoTable({
      startY:y+2,
      head:[cols.map(i=>ds.h[i])],
      body:ds.rows.length ? ds.rows.map(r=>cols.map(i=>cel(r[i],i))) : [[{content:'Sin datos en este período',colSpan:cols.length}]],
      foot:(ds.sum&&ds.rows.length) ? [cols.map((i,j)=>j===0?'Total':ds.sum.includes(i)?{content:fmtN(sum(ds.rows,r=>r[i])),styles:{halign:'right',cellPadding:{top:1.5,bottom:1.5,left:9,right:1.5}}}:'')] : [],
      showFoot:'lastPage',
      styles:{fontSize:FS,cellPadding:1.5,valign:'middle'},
      headStyles:{fillColor:[51,56,61],fontSize:8,halign:'center'},
      didParseCell:d=>{ if(d.section==='head'){ d.cell.styles.halign='center'; d.cell.styles.cellPadding=1.5; d.cell.styles.fontSize=8; } },
      footStyles:{fillColor:[231,233,235],textColor:20,fontStyle:'bold'},
      columnStyles:colStyles,
      margin:{left:14,right:14},
      didDrawCell:d=>{
        if((d.section==='body'||d.section==='foot') && nums.includes(cols[d.column.index]) && d.cell.text.join('').trim()){
          const f=d.section==='foot'; doc.setFont('helvetica',f?'bold':'normal'); doc.setFontSize(FS); doc.setTextColor(f?20:0);
          doc.text('RD$',d.cell.x+1.5,d.cell.y+d.cell.height/2+1);
          doc.setFont('helvetica','normal'); doc.setTextColor(0);
        }
      }
    });
    y=doc.lastAutoTable.finalY+12;
  }
  const conFotos=(gastosFotos||[]).slice().sort((a,b)=>a.fecha.localeCompare(b.fecha)).filter(g=>g.fotos?.length);
  if(gastosFotos?.length && !conFotos.length) toast('No invoice photos in these expenses');
  if(conFotos.length){
    const aviso=toast('Preparing photos…',60000);
    for(const g of conFotos){
      for(let i=0;i<g.fotos.length;i++){
        const {data,error}=await sb.storage.from(BUCKET).download(g.fotos[i]);
        if(error||!data) continue;
        const url=await blobADataURL(data), m=await medidas(url); if(!m) continue;
        doc.addPage(); doc.setFontSize(11);
        doc.text(`${fecha(g.fecha)}  |  ${g.suplidor||g.descripcion||''}  |  ${fmt(g.monto_total)}${g.ncf?'  |  NCF '+g.ncf:''}${g.fotos.length>1?`  (${i+1}/${g.fotos.length})`:''}`,14,14);
        const maxW=ancho-28, maxH=alto-34, k=Math.min(maxW/m.w,maxH/m.h);
        const w=m.w*k, h=m.h*k;
        doc.addImage(url,'JPEG',(ancho-w)/2,22,w,h);
      }
    }
    aviso.remove();
  }
  const n=doc.internal.getNumberOfPages();
  for(let p=1;p<=n;p++){ doc.setPage(p); doc.setFontSize(8); doc.text(`Página ${p} de ${n}`,ancho-34,alto-8); }
  await descargar(doc.output('blob'),nombre);
}
async function descargar(blob,nombre){
  if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) && navigator.canShare){
    const file=new File([blob],nombre,{type:blob.type});
    if(navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title:nombre}); return; }
      catch(e){ if(e.name==='AbortError') return; }
    }
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nombre;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
}
</script>
