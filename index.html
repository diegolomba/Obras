<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Obras">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1f3a5f">
<title>Obras Diego</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1b2430;--mut:#6b7686;--pri:#1f5fa8;--ok:#1e8a4c;--bad:#c0392b;--warn:#b4660b;--bd:#e3e7ee}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
header{position:sticky;top:0;background:#1f3a5f;color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;justify-content:space-between;align-items:center;z-index:5}
header h1{font-size:18px;margin:0}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:15px;margin-left:6px}
header .izq{display:flex;align-items:center;gap:10px}header .izq button{margin-left:0;font-size:18px;padding:4px 10px}
main{padding:12px 12px calc(84px + env(safe-area-inset-bottom));max-width:900px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:8px 0 6px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .i{font-size:20px}
nav button.on{color:var(--pri);font-weight:600}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1 1 130px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;font-size:16px;background:#fff;color:var(--tx);font-family:inherit}
textarea{min-height:180px;line-height:1.4}
.btn{border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;background:var(--pri);color:#fff;cursor:pointer}
.btn.sec{background:#e8eef6;color:var(--pri)}.btn.bad{background:#fdecea;color:var(--bad)}.btn.ok{background:var(--ok)}
.btn.sm{padding:7px 10px;font-size:13px;flex:0 0 auto}.btn.full{width:100%}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--card);border-radius:12px;padding:10px}
.stat b{display:block;font-size:16px;margin-top:2px}.stat span{font-size:12px;color:var(--mut)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.t{font-weight:600}.s{font-size:13px;color:var(--mut);margin-top:2px}
.prev{font-size:14px;margin-top:6px;white-space:pre-wrap;color:#3a4552}
.amt{font-weight:700;white-space:nowrap;text-align:right}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;background:#e8eef6;color:var(--pri);margin-right:4px}
.tag.p{background:#fff3e0;color:var(--warn)}.tag.g{background:#e6f4ea;color:var(--ok)}.tag.x{background:#eee;color:#777}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 4px;border-bottom:1px solid var(--bd);text-align:left}
th{font-size:11px;color:var(--mut);font-weight:600}td.n,th.n{text-align:right;white-space:nowrap}
tr.tot td{border-top:2px solid var(--tx);font-weight:700}
.seg{display:flex;background:#e3e7ee;border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:8px;font-size:13px;color:var(--tx)}.seg button.on{background:#fff;font-weight:600}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-body{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 6px;font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1b2430;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:30;max-width:90%;text-align:center}
.empty{text-align:center;color:var(--mut);padding:24px}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--tx);margin-top:12px}.chk input{width:22px;height:22px;flex:0 0 auto}
.h{display:flex;justify-content:space-between;align-items:center;margin:2px 0 10px;gap:8px}.h h2{font-size:16px;margin:0}
.asis{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.asis .nm{flex:1}
.neg{color:var(--bad)}
.fotos{display:flex;flex-wrap:wrap;gap:8px}
.foto{position:relative;width:96px;height:96px}
.foto img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);background:#ddd}
.foto button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:11px;color:var(--mut);padding:2px 0}
.cal .d{background:#fff;border:1px solid var(--bd);border-radius:8px;min-height:54px;padding:4px 5px;font-size:13px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.cal .d .c{font-size:11px;font-weight:600;text-align:right}
.cal .d.full{background:#e6f4ea;border-color:#bfe3c9}.cal .d.part{background:#fff3e0;border-color:#f3d6a8}
.cal .d.hoy{outline:2px solid var(--pri);outline-offset:-1px}
.cal .d.vac{background:none;border:0;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{border:1px solid var(--bd);background:#fff;border-radius:16px;padding:7px 11px;font-size:13px;color:var(--tx)}
.chips button.on{color:#fff;background:var(--ok);border-color:var(--ok)}
.chips button.on.tar,.chips button.on.par,.chips button.on.exc{background:var(--warn);border-color:var(--warn)}
.chips button.on.aus{background:var(--bad);border-color:var(--bad)}
.dia{padding:10px 0;border-bottom:1px solid var(--bd)}
#login{max-width:380px;margin:12vh auto;padding:20px}
</style>
</head>
<body>

<div id="login" hidden>
  <form class="card" onsubmit="event.preventDefault();entrar()">
    <h2 style="margin-top:0">Obras · Gastos</h2>
    <label>Correo</label><input id="l_email" type="email" autocomplete="username" autocapitalize="off">
    <label>Contraseña</label><input id="l_pass" type="password" autocomplete="current-password">
    <button class="btn full" style="margin-top:14px">Entrar</button>
    <div id="l_err" class="s" style="color:var(--bad);margin-top:8px"></div>
  </form>
</div>

<div id="app" hidden>
  <header>
    <div class="izq"><button onclick="menu()" aria-label="Menú">☰</button><h1>Obras Diego</h1></div>
    <div><button onclick="recargar()" aria-label="Actualizar">⟳</button><button onclick="salir()">Salir</button></div>
  </header>
  <main id="view"><div class="empty">Cargando…</div></main>
  <nav id="nav"></nav>
</div>

<div id="sheet" class="sheet" hidden onclick="if(event.target===this)cerrar()"><div class="sheet-body" id="sheetBody"></div></div>

<script>
const SUPABASE_URL = 'https://unmikmufvkhfxpxijjrc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_XBP4goKYsISElycMXwHr8g_rcve8nW8';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const PARTIDAS_SUGERIDAS = ['Materiales','Mano de obra','Subcontratos','Equipos y alquiler','Herramientas','Transporte','Combustible','Electricidad','Plomería','Pintura','Terminaciones','Permisos y trámites','Gastos administrativos'];
const METODOS = ['Efectivo','Transferencia','Tarjeta','Cheque','Crédito'];
const BANCOS = ['Banreservas','Banco Popular','BHD','Scotiabank','Banco Santa Cruz','Promerica','Banesco','Banco Caribe','BDI','Banco Vimenca','Banco López de Haro','Banco Lafise','Asociación Popular (APAP)','Asociación Cibao','Asociación La Nacional'];
// Tarifa diaria según Código de Trabajo (semana de 44 h = 5.5 días; quincena = 23.83/2 días)
const DIAS_PERIODO = {diario:1, semanal:5.5, quincenal:11.915};
const ESTADOS = [['presente','Presente'],['tardanza','Tardanza'],['parcial','Parcial'],['excusa','Excusa'],['ausente','Faltó']];
const LBL_ESTADO = Object.fromEntries(ESTADOS);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = v => Math.round((Number(v)||0)*100)/100;
const fmtN = n => Number(n||0).toLocaleString('es-DO',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt = n => 'RD$ ' + fmtN(n);
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const hoy = () => ymd(new Date());
const sumaDias = (f,n) => { const d=new Date(f+'T12:00:00'); d.setDate(d.getDate()+n); return ymd(d); };
const fecha = f => { if(!f) return ''; const s=String(f).slice(0,10).split('-'); return `${s[2]}/${s[1]}/${s[0]}`; };
const sum = (a,f) => a.reduce((s,x)=>s+(Number(f(x))||0),0);
const num = sel => r2(parseFloat($(sel).value)||0);
const nomObra = id => S.obras.find(o=>o.id===id)?.nombre || '';
const nomEmp = id => S.empleados.find(e=>e.id===id)?.nombre || '';
const obraOpts = (sel, blank='— Sin obra —') => `<option value="">${blank}</option>` + S.obras.map(o=>`<option value="${o.id}" ${o.id===sel?'selected':''}>${esc(o.nombre)}${o.estado!=='activa'?' ('+esc(o.estado)+')':''}</option>`).join('');

const S = {
  obras:[], gastos:[], notas:[], empleados:[], asistencia:[], adelantos:[], pagos:[], suplidores:[], partidas:[],
  tab:'inicio', sub:'asistencia', db:'suplidores', listo:false,
  f:{tipo:'',obra:'',desde:'',hasta:'',q:''},
  fn:'todas', qs:'', calMes:hoy().slice(0,7), nd:sumaDias(hoy(),-6), nh:hoy(),
  fotosTmp:[], fotosDir:'', diaTmp:{}, diaF:''
};

function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function abrir(html){ $('#sheetBody').innerHTML=html; $('#sheet').hidden=false; $('#sheetBody').scrollTop=0; }
function cerrar(){ $('#sheet').hidden=true; }

/* ---------- Sesión ---------- */
async function entrar(){
  $('#l_err').textContent='';
  const {error} = await sb.auth.signInWithPassword({email:$('#l_email').value.trim(), password:$('#l_pass').value});
  if(error) $('#l_err').textContent = 'No se pudo entrar: revisa el correo y la contraseña.';
}
async function salir(){ await sb.auth.signOut(); }
sb.auth.onAuthStateChange((ev, session) => {
  if(session){
    if(!S.listo){ S.listo=true; $('#login').hidden=true; $('#app').hidden=false; setTimeout(cargar,0); }
  } else {
    S.listo=false; $('#app').hidden=true; $('#login').hidden=false;
  }
});

/* ---------- Datos ---------- */
async function cargar(){
  const tablas = {obras:'obras',gastos:'gastos',notas:'notas',empleados:'empleados',asistencia:'asistencia',adelantos:'adelantos',pagos:'pagos_nomina',suplidores:'suplidores',partidas:'partidas'};
  const keys = Object.keys(tablas);
  const res = await Promise.all(keys.map(k => sb.from(tablas[k]).select('*').range(0,9999)));
  for(let i=0;i<keys.length;i++){
    if(res[i].error){ toast('Error cargando '+tablas[keys[i]]+': '+res[i].error.message); continue; }
    S[keys[i]] = res[i].data || [];
  }
  S.obras.sort((a,b)=>(a.estado==='activa'?0:1)-(b.estado==='activa'?0:1) || a.nombre.localeCompare(b.nombre));
  S.gastos.sort((a,b)=>b.fecha.localeCompare(a.fecha) || String(b.creado).localeCompare(String(a.creado)));
  S.empleados.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  S.suplidores.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  S.partidas.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  S.pagos.sort((a,b)=>String(b.fecha_pago).localeCompare(String(a.fecha_pago)));
  render();
}
async function recargar(){ await cargar(); toast('Actualizado'); }
async function guardar(t,id,d){
  const {error} = id ? await sb.from(t).update(d).eq('id',id) : await sb.from(t).insert(d);
  if(error) return toast('Error: '+error.message);
  cerrar(); await cargar(); toast('Guardado');
}
async function borrar(t,id){
  if(!confirm('¿Seguro que quieres borrarlo?')) return;
  const {error} = await sb.from(t).delete().eq('id',id);
  if(error) return toast(error.code==='23503' ? 'No se puede borrar porque tiene registros asociados.' : 'Error: '+error.message);
  cerrar(); await cargar(); toast('Borrado');
}

/* ---------- Navegación ---------- */
const TABS=[['inicio','🏠','Inicio'],['gastos','🧾','Gastos'],['nomina','👷','Nómina'],['notas','📝','Notas'],['database','🗂️','Database']];
function ir(t){ S.tab=t; render(); window.scrollTo(0,0); }
function render(){
  $('#nav').innerHTML = TABS.map(([k,i,l])=>`<button class="${S.tab===k?'on':''}" onclick="ir('${k}')"><span class="i">${i}</span>${l}</button>`).join('');
  $('#view').innerHTML = ({inicio:vInicio,gastos:vGastos,nomina:vNomina,notas:vNotas,database:vDatabase})[S.tab]();
}
function seg(opciones, actual, accion){
  return `<div class="seg">${opciones.map(([k,l])=>`<button class="${actual===k?'on':''}" onclick="${accion}('${k}')">${l}</button>`).join('')}</div>`;
}

/* ---------- Inicio ---------- */
function vInicio(){
  const m = hoy().slice(0,7);
  const gm = S.gastos.filter(g=>g.fecha?.startsWith(m));
  const obraM = sum(gm.filter(g=>g.tipo==='obra'),g=>g.monto_total);
  const persM = sum(gm.filter(g=>g.tipo==='personal'),g=>g.monto_total);
  const itbisM = sum(gm,g=>g.itbis);
  const nomM = sum(S.pagos.filter(p=>p.fecha_pago?.startsWith(m)),p=>p.neto);
  const filas = S.obras.map(o=>({o, g:sum(gm.filter(x=>x.obra_id===o.id),x=>x.monto_total)})).filter(f=>f.o.estado==='activa'||f.g);
  const sinObra = sum(gm.filter(g=>g.tipo==='obra'&&!g.obra_id),g=>g.monto_total);
  return `
  <div class="s" style="margin:0 0 6px">Este mes</div>
  <div class="stats">
    <div class="stat"><span>Gastos de obras</span><b>${fmt(obraM)}</b></div>
    <div class="stat"><span>Gastos personales</span><b>${fmt(persM)}</b></div>
    <div class="stat"><span>Nómina pagada</span><b>${fmt(nomM)}</b></div>
    <div class="stat"><span>ITBIS pagado</span><b>${fmt(itbisM)}</b></div>
  </div>
  <div class="card"><div class="h"><h2>Balance mes</h2></div>
  <table>
    ${filas.map(f=>`<tr onclick="verGastos({obra:'${f.o.id}',desde:'${m}-01'})"><td>${esc(f.o.nombre)}</td><td class="n">${fmtN(f.g)}</td></tr>`).join('')}
    ${sinObra?`<tr><td><i>Obra sin asignar</i></td><td class="n">${fmtN(sinObra)}</td></tr>`:''}
    <tr onclick="verGastos({tipo:'personal',desde:'${m}-01'})"><td>Personal</td><td class="n">${fmtN(persM)}</td></tr>
    <tr onclick="S.sub='pagos';ir('nomina')"><td>Nómina</td><td class="n">${fmtN(nomM)}</td></tr>
    <tr class="tot"><td>Total</td><td class="n">${fmtN(obraM+persM+nomM)}</td></tr>
  </table>
  </div>
  <button class="btn full" onclick="formGasto()">+ Nuevo gasto</button>`;
}
function verGastos(f){ S.f={tipo:'',obra:'',desde:'',hasta:'',q:'',...f}; ir('gastos'); }

/* ---------- Gastos ---------- */
function gastosFiltrados(){
  const f=S.f, q=f.q.toLowerCase();
  return S.gastos.filter(g=>(!f.tipo||g.tipo===f.tipo)&&(!f.obra||g.obra_id===f.obra)&&(!f.desde||g.fecha>=f.desde)&&(!f.hasta||g.fecha<=f.hasta)
    &&(!q||[g.descripcion,g.suplidor,g.ncf,g.rnc,g.partida].join(' ').toLowerCase().includes(q)));
}
function setF(k,v){ S.f[k]=v; if(k==='tipo'&&v==='personal') S.f.obra=''; $('#glist').innerHTML=listaGastos(); }
function vGastos(){
  const f=S.f;
  return `
  <div class="card">
    <div class="row">
      <div><label>Tipo</label><select onchange="setF('tipo',this.value)"><option value="">Todos</option><option value="obra" ${f.tipo==='obra'?'selected':''}>Obra</option><option value="personal" ${f.tipo==='personal'?'selected':''}>Personal</option></select></div>
      <div><label>Obra</label><select onchange="setF('obra',this.value)">${obraOpts(f.obra,'Todas')}</select></div>
    </div>
    <div class="row">
      <div><label>Desde</label><input type="date" value="${f.desde}" onchange="setF('desde',this.value)"></div>
      <div><label>Hasta</label><input type="date" value="${f.hasta}" onchange="setF('hasta',this.value)"></div>
    </div>
    <label>Buscar</label><input type="search" placeholder="Suplidor, NCF, descripción…" value="${esc(f.q)}" oninput="setF('q',this.value)">
  </div>
  <div class="row" style="margin-bottom:10px"><button class="btn" onclick="formGasto()">+ Nuevo gasto</button></div>
  <div class="row" style="margin-bottom:10px"><button class="btn sec" onclick="exportarFiltrado('xlsx')">Excel</button><button class="btn sec" onclick="exportarFiltrado('pdf')">PDF</button></div>
  <div id="glist">${listaGastos()}</div>`;
}
function listaGastos(){
  const gs=gastosFiltrados();
  return gs.map(g=>`<div class="card item" onclick="formGasto('${g.id}')">
    <div><div class="t">${esc(g.suplidor||g.descripcion||'(sin suplidor)')}</div>
      <div class="s">${fecha(g.fecha)}${g.suplidor&&g.descripcion?' · '+esc(g.descripcion):''}</div>
      <div class="s">${g.tipo==='personal'?'<span class="tag p">Personal</span>':`<span class="tag">${esc(nomObra(g.obra_id)||'Sin obra')}</span>`}${g.partida?`<span class="tag x">${esc(g.partida)}</span>`:''}${g.ncf?' NCF '+esc(g.ncf):''}</div></div>
    <div class="amt">${fmt(g.monto_total)}${Number(g.itbis)?`<div class="s">ITBIS ${fmtN(g.itbis)}</div>`:''}${Number(g.propina)?`<div class="s">Propina ${fmtN(g.propina)}</div>`:''}</div>
  </div>`).join('') || '<div class="empty">No hay gastos con estos filtros.</div>';
}
function formGasto(id){
  const g = S.gastos.find(x=>x.id===id) || {fecha:hoy(), tipo:S.f.tipo||'obra', obra_id:S.f.obra||'', metodo_pago:''};
  const pn = S.partidas.map(p=>p.nombre); if(g.partida && !pn.includes(g.partida)) pn.push(g.partida);
  const mets = [...METODOS]; if(g.metodo_pago && !mets.includes(g.metodo_pago)) mets.push(g.metodo_pago);
  const lleva = !id || Number(g.itbis)>0;
  const otro = !g.suplidor_id && !!g.suplidor;
  abrir(`<h2>${id?'Editar':'Nuevo'} gasto</h2>
  <div class="row">
    <div><label>Fecha</label><input type="date" id="g_fecha" value="${g.fecha}"></div>
    <div><label>Tipo</label><select id="g_tipo" onchange="$('#g_obraw').hidden=this.value!=='obra'"><option value="obra" ${g.tipo==='obra'?'selected':''}>Obra</option><option value="personal" ${g.tipo==='personal'?'selected':''}>Personal</option></select></div>
  </div>
  <div id="g_obraw" ${g.tipo!=='obra'?'hidden':''}><label>Obra</label><select id="g_obra">${obraOpts(g.obra_id)}</select></div>
  <label>Descripción</label><input id="g_desc" value="${esc(g.descripcion)}">
  <div class="row">
    <div><label>Suplidor</label><select id="g_supid" onchange="elegirSup()">
      <option value="">${S.suplidores.length?'— Elegir —':'— Crea suplidores en Database —'}</option>

function elegirSup(){
  const v=$('#g_supid').value;
  $('#g_sup').hidden = v!=='otro';
  if(v==='otro'){ $('#g_sup').value=''; $('#g_rnc').value=''; $('#g_sup').focus(); return; }
  const s=S.suplidores.find(x=>x.id===v);
  $('#g_sup').value = s ? s.nombre : '';
  $('#g_rnc').value = s ? (s.documento||'') : '';
}
function calc(src){
  const ti=$('#g_lleva').checked?0.18:0, tp=$('#g_llevap').checked?0.10:0;
  const v=id=>parseFloat($(id).value)||0;
  const sin=v('#g_sin'), it=v('#g_itbis'), pr=v('#g_prop'), tot=v('#g_tot');
  if(src==='tot'){
    if(!tot){ ['#g_sin','#g_itbis','#g_prop'].forEach(i=>$(i).value=''); return; }
    const s=r2(tot/(1+ti+tp)), i=r2(s*ti), p=r2(tot-s-i);
    $('#g_sin').value=s; $('#g_itbis').value=ti?i:''; $('#g_prop').value=tp?p:'';
  } else if(src==='ajuste'){
    $('#g_tot').value=(sin||it||pr)?r2(sin+it+pr):'';
  } else {
    if(!sin){ ['#g_itbis','#g_prop','#g_tot'].forEach(i=>$(i).value=''); return; }
    const i=r2(sin*ti), p=r2(sin*tp);
    $('#g_itbis').value=ti?i:''; $('#g_prop').value=tp?p:''; $('#g_tot').value=r2(sin+i+p);
  }
}
async function guardarGasto(id){

  const d={fecha:$('#g_fecha').value||hoy(), tipo, obra_id:tipo==='obra'?($('#g_obra').value||null):null,
    descripcion:$('#g_desc').value.trim(), suplidor:$('#g_sup').value.trim(),
    suplidor_id:(supid&&supid!=='otro')?supid:null, rnc:$('#g_rnc').value.replace(/[^0-9]/g,''),
    ncf:$('#g_ncf').value.trim().toUpperCase(), partida:$('#g_part').value,

  if(!d.monto_total) return toast('Pon el monto neto o bruto del gasto');

/* ---------- Nómina: asistencia y pagos ---------- */
const estadoDe = a => !a ? '' : ((!a.estado||a.estado==='presente') && !a.presente) ? 'ausente' : (a.estado||'presente');
const factorDia = a => { const e=estadoDe(a); return (e==='presente'||e==='tardanza')?1 : e==='parcial'?0.5 : e==='excusa'?(a.excusa_pagada?1:0) : 0; };
const fue = a => ['presente','tardanza','parcial'].includes(estadoDe(a));
const tarifaDiaria = e => r2((Number(e.sueldo)||0)/(DIAS_PERIODO[e.tipo_sueldo]||1));
const pendAdel = id => sum(S.adelantos.filter(a=>a.empleado_id===id&&!a.descontado),a=>a.monto);
function setSub(k){ S.sub=k; render(); }

function vNomina(){
  return seg([['asistencia','Asistencia'],['pagos','Pagos']], S.sub, 'setSub') + (S.sub==='pagos' ? vPagos() : vAsistencia());
}
function vAsistencia(){
  const [y,m]=S.calMes.split('-').map(Number);
  const off=(new Date(y,m-1,1).getDay()+6)%7, nd=new Date(y,m,0).getDate();
  const act=S.empleados.filter(e=>e.activo).length;
  const titulo=new Date(y,m-1,15).toLocaleDateString('es-DO',{month:'long',year:'numeric'});
  let cel=['L','M','M','J','V','S','D'].map(d=>`<div class="wd">${d}</div>`).join('');
  for(let i=0;i<off;i++) cel+='<div class="d vac"></div>';
  for(let d=1;d<=nd;d++){
    const f=`${S.calMes}-${String(d).padStart(2,'0')}`;
    const regs=S.asistencia.filter(a=>a.fecha===f), n=regs.filter(fue).length;
    const cls=regs.length?((act&&n>=act)?'full':'part'):'';
    cel+=`<div class="d ${cls} ${f===hoy()?'hoy':''}" onclick="abrirDia('${f}')"><span>${d}</span><span class="c">${regs.length?n+'/'+act:''}</span></div>`;
  }
  const regsM=S.asistencia.filter(a=>a.fecha.startsWith(S.calMes));
  const filas=S.empleados.filter(e=>e.activo||regsM.some(a=>a.empleado_id===e.id)).map(e=>{
    const rs=regsM.filter(a=>a.empleado_id===e.id);
    return {e, dias:sum(rs,factorDia), tar:rs.filter(a=>estadoDe(a)==='tardanza').length, falt:rs.filter(a=>estadoDe(a)==='ausente').length};
  });
  return `<div class="card">
    <div class="h"><button class="btn sm sec" onclick="mesCal(-1)">‹</button><h2 style="text-transform:capitalize">${titulo}</h2><button class="btn sm sec" onclick="mesCal(1)">›</button></div>
    <div class="cal">${cel}</div>
    <div class="s" style="margin-top:8px">Toca un día para marcar la asistencia.</div></div>
  ${filas.length?`<div class="card"><div class="h"><h2>Resumen del mes</h2></div>
    <table><tr><th>Empleado</th><th class="n">Días a pagar</th><th class="n">Tardanzas</th><th class="n">Faltas</th></tr>
    ${filas.map(f=>`<tr><td>${esc(f.e.nombre)}</td><td class="n">${f.dias}</td><td class="n">${f.tar}</td><td class="n">${f.falt}</td></tr>`).join('')}</table></div>`
  :'<div class="empty">Agrega empleados en Database para marcar la asistencia.</div>'}`;
}
function mesCal(k){ const [y,m]=S.calMes.split('-').map(Number); S.calMes=ymd(new Date(y,m-1+k,1)).slice(0,7); render(); }
function abrirDia(f){
  const emps=S.empleados.filter(e=>e.activo||S.asistencia.some(a=>a.fecha===f&&a.empleado_id===e.id));
  if(!emps.length) return toast('Primero agrega empleados en Database');
  S.diaF=f; S.diaTmp={};
  emps.forEach(e=>{ const a=S.asistencia.find(x=>x.fecha===f&&x.empleado_id===e.id);
    S.diaTmp[e.id]={estado:estadoDe(a), he:Number(a?.horas_extra)||0, pag:!!a?.excusa_pagada, motivo:a?.motivo||'', id:a?.id||null}; });
  const tit=new Date(f+'T12:00:00').toLocaleDateString('es-DO',{weekday:'long',day:'numeric',month:'long'});
  abrir(`<div class="h"><h2 style="text-transform:capitalize">${tit}</h2><button class="btn sm sec" onclick="diaTodos()">Todos presentes</button></div>
  ${emps.map(e=>`<div class="dia" id="dr_${e.id}">${filaDia(e)}</div>`).join('')}
  <div class="row" style="margin-top:16px"><button class="btn sec" onclick="cerrar()">Cancelar</button><button class="btn" onclick="guardarDia()">Guardar</button></div>`);
}
function filaDia(e){
  const t=S.diaTmp[e.id];
  return `<div class="t">${esc(e.nombre)}</div>${e.puesto?`<div class="s">${esc(e.puesto)}</div>`:''}
  <div class="chips">${ESTADOS.map(([k,l])=>`<button class="${t.estado===k?'on '+k.slice(0,3):''}" onclick="marcarDia('${e.id}','${k}')">${l}</button>`).join('')}</div>
  ${t.estado==='excusa'?`<label class="chk"><input type="checkbox" ${t.pag?'checked':''} onchange="S.diaTmp['${e.id}'].pag=this.checked"> Se paga</label>
    <input style="margin-top:6px" placeholder="Motivo" value="${esc(t.motivo)}" oninput="S.diaTmp['${e.id}'].motivo=this.value">`:''}
  ${(t.estado==='presente'||t.estado==='tardanza')?`<div class="row" style="margin-top:6px;align-items:center"><span class="s" style="flex:1 1 auto">Horas extra</span>
    <input type="number" inputmode="decimal" step="0.5" style="flex:0 0 80px;padding:6px" value="${t.he||''}" placeholder="0" oninput="S.diaTmp['${e.id}'].he=parseFloat(this.value)||0"></div>`:''}`;
}
function marcarDia(eid,k){
  const t=S.diaTmp[eid]; t.estado = t.estado===k ? '' : k;
  $('#dr_'+eid).innerHTML=filaDia(S.empleados.find(e=>e.id===eid));
}
function diaTodos(){
  for(const [eid,t] of Object.entries(S.diaTmp)){ if(!t.estado){ t.estado='presente'; $('#dr_'+eid).innerHTML=filaDia(S.empleados.find(e=>e.id===eid)); } }
}
async function guardarDia(){
  const ups=[], dels=[];
  for(const [eid,t] of Object.entries(S.diaTmp)){
    if(!t.estado){ if(t.id) dels.push(t.id); continue; }
    const pag=t.estado==='excusa'&&t.pag, conHE=t.estado==='presente'||t.estado==='tardanza';
    ups.push({empleado_id:eid, fecha:S.diaF, estado:t.estado, presente:fue({estado:t.estado,presente:true})||pag,
      horas_extra:conHE?r2(t.he):0, excusa_pagada:pag, motivo:t.estado==='excusa'?(t.motivo.trim()||null):null, obra_id:null});
  }
  if(ups.length){ const {error}=await sb.from('asistencia').upsert(ups,{onConflict:'empleado_id,fecha'}); if(error) return toast('Error: '+error.message); }
  if(dels.length){ const {error}=await sb.from('asistencia').delete().in('id',dels); if(error) return toast('Error: '+error.message); }
  cerrar(); await cargar(); toast('Asistencia guardada');
}

function calcNomina(){
  return S.empleados.map(e=>{
    const as=S.asistencia.filter(a=>a.empleado_id===e.id&&a.fecha>=S.nd&&a.fecha<=S.nh);
    const dias=sum(as,factorDia), he=sum(as.filter(a=>['presente','tardanza'].includes(estadoDe(a))),a=>a.horas_extra), td=tarifaDiaria(e);
    const bruto=r2(dias*td + he*(td/8)*1.35);
    const ad=pendAdel(e.id);
    const ya=S.pagos.find(p=>p.empleado_id===e.id&&p.desde===S.nd&&p.hasta===S.nh);
    return {e,dias,he,td,bruto,ad,neto:r2(bruto-ad),ya};
  }).filter(x=>x.dias>0||x.ya);
}

    <div style="margin-top:8px;text-align:right">${f.ya?'<span class="tag g">Pagado</span>':`<button class="btn sm ok" onclick="pagar('${f.e.id}')">Registrar pago</button>`}</div>
  </div>`).join('') || '<div class="empty">No hay días trabajados en este período.</div>'}
  ${pend.length>1?`<button class="btn full ok" onclick="pagarTodos()">Registrar pago a todos</button>`:''}
  <div class="card" style="margin-top:12px"><div class="h"><h2>Pagos registrados</h2></div>
  ${hist.length?`<table><tr><th>Fecha</th><th>Empleado</th><th class="n">Pagado</th></tr>${hist.map(p=>`<tr><td>${fecha(p.fecha_pago)}</td><td>${esc(nomEmp(p.empleado_id))}</td><td class="n">${fmtN(p.neto)}</td></tr>`).join('')}</table>`:'<div class="empty">Aún no hay pagos.</div>'}</div>`;

async function pagarUno(f){
  const {error}=await sb.from('pagos_nomina').insert({empleado_id:f.e.id,obra_id:null,desde:S.nd,hasta:S.nh,dias_trabajados:f.dias,bruto:f.bruto,descuentos:f.ad,neto:f.neto,fecha_pago:hoy()});
  if(error){ toast('Error: '+error.message); return false; }
  if(f.ad) await sb.from('adelantos').update({descontado:true}).eq('empleado_id',f.e.id).eq('descontado',false);
  return true;
}
async function pagar(eid){
  const f=calcNomina().find(x=>x.e.id===eid&&!x.ya); if(!f) return;
  if(!confirm(`Registrar pago a ${f.e.nombre} por ${fmt(f.neto)}?`)) return;
  if(await pagarUno(f)){ await cargar(); toast('Pago registrado'); }
}
async function pagarTodos(){
  const pend=calcNomina().filter(f=>!f.ya);
  if(!confirm(`Registrar ${pend.length} pagos por un total de ${fmt(sum(pend,f=>f.neto))}?`)) return;
  for(const f of pend) await pagarUno(f);
  await cargar(); toast('Pagos registrados');
}

const bloqueFotos = () => `<label>Fotos</label><div id="s_fotos" class="fotos"></div>

  <span id="s_subiendo" class="s"></span>`;
async function pintarFotos(){
  const box=$('#s_fotos'); if(!box) return;
  if(!S.fotosTmp.length){ box.innerHTML='<div class="s">Sin fotos</div>'; return; }
  const {data}=await sb.storage.from('suplidores').createSignedUrls(S.fotosTmp,3600);
  box.innerHTML=S.fotosTmp.map((p,i)=>{const u=data?.[i]?.signedUrl||'';
    return `<div class="foto"><a href="${u}" target="_blank" rel="noopener"><img src="${u}" alt="foto"></a><button onclick="quitarFoto(${i})">✕</button></div>`}).join('');
}
function reducir(file){
  return new Promise((ok,mal)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{const max=1600,k=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      c.toBlob(b=>b?ok(b):mal(new Error('No se pudo procesar la foto')),'image/jpeg',0.82);};
    img.onerror=()=>{URL.revokeObjectURL(url); mal(new Error('Formato de foto no soportado'));};
    img.src=url;
  });
}
async function subirFotos(input){
  const files=[...input.files]; input.value='';
  for(const f of files){
    $('#s_subiendo').textContent=' Subiendo…';
    try{
      const blob=await reducir(f);
      const path=`${S.fotosDir}${crypto.randomUUID()}.jpg`;
      const {error}=await sb.storage.from('suplidores').upload(path,blob,{contentType:'image/jpeg'});
      if(error) throw error;
      S.fotosTmp.push(path);
    }catch(e){ toast('Error subiendo foto: '+e.message); }
  }
  $('#s_subiendo').textContent=' Recuerda tocar Guardar.';
  pintarFotos();
}
function quitarFoto(i){ S.fotosTmp.splice(i,1); pintarFotos(); }

/* ---------- Exportar ---------- */
const enRango = (f,d1,d2) => !!f && (!d1||f>=d1) && (!d2||f<=d2);
function dsGastos(gs){
  gs=gs.slice().sort((a,b)=>a.fecha.localeCompare(b.fecha));
  return {t:'Gastos', h:['Fecha','Tipo','Obra','Descripción','Suplidor','RNC / Cédula','NCF','Partida','Neto','ITBIS','Propina','Bruto','Método de pago'],
    rows:gs.map(g=>[fecha(g.fecha),g.tipo==='obra'?'Obra':'Personal',g.tipo==='obra'?nomObra(g.obra_id):'Personal',g.descripcion||'',g.suplidor||'',g.rnc||'',g.ncf||'',g.partida||'',r2(g.monto_sin_itbis),r2(g.itbis),r2(g.propina),r2(g.monto_total),g.metodo_pago||'']),
    num:[8,9,10,11], sum:[8,9,10,11], pdf:[0,4,2,3,7,6,8,9,10,11]};
}
function dsResumen(d1,d2){
  const gs=S.gastos.filter(g=>enRango(g.fecha,d1,d2));
  const rows=S.obras.map(o=>[o.nombre,r2(sum(gs.filter(g=>g.obra_id===o.id),g=>g.monto_total))]).filter(r=>r[1]);
  const sinObra=sum(gs.filter(g=>g.tipo==='obra'&&!g.obra_id),g=>g.monto_total); if(sinObra) rows.push(['Obra sin asignar',r2(sinObra)]);
  rows.push(['Personal',r2(sum(gs.filter(g=>g.tipo==='personal'),g=>g.monto_total))]);
  rows.push(['Nómina',r2(sum(S.pagos.filter(p=>enRango(p.fecha_pago,d1,d2)),p=>p.neto))]);
  return {t:'Balance', h:['Concepto','Monto'], rows, num:[1], sum:[1]};
}
function dsNomina(d1,d2){
  const ps=S.pagos.filter(p=>enRango(p.fecha_pago,d1,d2)).sort((a,b)=>String(a.fecha_pago).localeCompare(String(b.fecha_pago)));
  return {t:'Nómina', h:['Fecha de pago','Empleado','Desde','Hasta','Días','Antes de adelantos','Adelantos','Pagado'],
    rows:ps.map(p=>[fecha(p.fecha_pago),nomEmp(p.empleado_id),fecha(p.desde),fecha(p.hasta),Number(p.dias_trabajados)||0,r2(p.bruto),r2(p.descuentos),r2(p.neto)]),
    num:[5,6,7], sum:[5,6,7]};
}
function dsAsistencia(d1,d2){
  const as=S.asistencia.filter(a=>enRango(a.fecha,d1,d2)).sort((a,b)=>a.fecha.localeCompare(b.fecha)||nomEmp(a.empleado_id).localeCompare(nomEmp(b.empleado_id)));
  const emps=S.empleados.filter(e=>as.some(a=>a.empleado_id===e.id));
  const cnt=(rs,k)=>rs.filter(a=>estadoDe(a)===k).length;
  return [
    {t:'Asistencia (resumen)', h:['Empleado','Presente','Tardanza','Parcial','Excusa pagada','Excusa no pagada','Faltó','Días a pagar'],
      rows:emps.map(e=>{const rs=as.filter(a=>a.empleado_id===e.id);
        return [e.nombre,cnt(rs,'presente'),cnt(rs,'tardanza'),cnt(rs,'parcial'),rs.filter(a=>estadoDe(a)==='excusa'&&a.excusa_pagada).length,rs.filter(a=>estadoDe(a)==='excusa'&&!a.excusa_pagada).length,cnt(rs,'ausente'),sum(rs,factorDia)];})},
    {t:'Asistencia (detalle)', h:['Fecha','Empleado','Estado','Horas extra','Excusa pagada','Motivo'],
      rows:as.map(a=>{const e=estadoDe(a);return [fecha(a.fecha),nomEmp(a.empleado_id),LBL_ESTADO[e]||e,Number(a.horas_extra)||0,e==='excusa'?(a.excusa_pagada?'Sí':'No'):'',a.motivo||''];})}
  ];
}
function dsEmpleados(){
  return {t:'Empleados', h:['Nombre','Cédula','Teléfono','Puesto','Tipo de sueldo','Sueldo','Activo','Adelantos pendientes'],
    rows:S.empleados.map(e=>[e.nombre,e.cedula||'',e.telefono||'',e.puesto||'',e.tipo_sueldo,r2(e.sueldo),e.activo?'Sí':'No',r2(pendAdel(e.id))]), num:[5,7]};
}
function dsSuplidores(){
  return {t:'Suplidores', h:['Nombre','Tipo','Profesión','RNC / Cédula','Teléfono','Correo','Dirección','Banco','Cuenta','Notas'],
    rows:S.suplidores.map(s=>[s.nombre,s.tipo==='empresa'?'Empresa':'Particular',s.tipo==='particular'?(s.profesion||''):'',s.documento||'',s.telefono||'',s.correo||'',s.direccion||'',s.banco||'',s.cuenta_banco||'',s.notas||'']),
    pdf:[0,1,2,3,4,5,7,8]};
}
function dsObras(d1,d2){
  const gs=S.gastos.filter(g=>enRango(g.fecha,d1,d2));
  return {t:'Obras', h:['Obra','Cliente','Dirección','Estado','Gastos en el período'],
    rows:S.obras.map(o=>[o.nombre,o.cliente||'',o.direccion||'',o.estado,r2(sum(gs.filter(g=>g.obra_id===o.id),g=>g.monto_total))]), num:[4], sum:[4]};
}
function dsNotas(d1,d2){
  const ns=S.notas.filter(n=>enRango(String(n.creado).slice(0,10),d1,d2)).sort((a,b)=>String(a.creado).localeCompare(String(b.creado)));
  return {t:'Notas', h:['Fecha','Obra','Título','Contenido'], rows:ns.map(n=>[fecha(n.creado),nomObra(n.obra_id)||'General',n.titulo||'',n.contenido||''])};
}
const EXPORTABLES=[['resumen','Balance'],['gastos','Gastos'],['nomina','Nómina (pagos)'],['asistencia','Asistencia'],['obras','Obras'],['empleados','Empleados'],['suplidores','Suplidores'],['notas','Notas']];
function menu(){
  const m=hoy().slice(0,7);
  abrir(`<h2>Exportar</h2>
  <div class="row">
    <div><label>Desde</label><input type="date" id="x_d1" value="${m}-01"></div>
    <div><label>Hasta</label><input type="date" id="x_d2" value="${hoy()}"></div>
  </div>
  <div class="chips"><button onclick="rango('mes')">Este mes</button><button onclick="rango('pasado')">Mes pasado</button><button onclick="rango('anio')">Este año</button><button onclick="rango('todo')">Todo</button></div>
  <label style="margin-top:14px">¿Qué quieres exportar?</label>
  ${EXPORTABLES.map(([k,l])=>`<label class="chk"><input type="checkbox" id="x_${k}" ${['resumen','gastos'].includes(k)?'checked':''}> ${l}</label>`).join('')}
  <div class="s" style="margin-top:10px">Empleados y suplidores salen completos; lo demás, según las fechas.</div>
  <div class="row" style="margin-top:16px">
    <button class="btn sec" onclick="cerrar()">Cancelar</button>
    <button class="btn" onclick="exportarMenu('xlsx')">Excel</button>
    <button class="btn" onclick="exportarMenu('pdf')">PDF</button>
  </div>`);
}
function rango(k){
  const d=new Date(); let a='', b='';
  if(k==='mes'){ a=ymd(new Date(d.getFullYear(),d.getMonth(),1)); b=hoy(); }
  if(k==='pasado'){ a=ymd(new Date(d.getFullYear(),d.getMonth()-1,1)); b=ymd(new Date(d.getFullYear(),d.getMonth(),0)); }
  if(k==='anio'){ a=d.getFullYear()+'-01-01'; b=hoy(); }
  $('#x_d1').value=a; $('#x_d2').value=b;
}
function textoPeriodo(d1,d2){ return (d1||d2) ? `Período: ${d1?fecha(d1):'inicio'} - ${d2?fecha(d2):'hoy'}` : 'Todo el historial'; }
async function exportarMenu(formato){
  const d1=$('#x_d1').value, d2=$('#x_d2').value;
  const sel=Object.fromEntries(EXPORTABLES.map(([k])=>[k,$('#x_'+k).checked]));
  const dss=[];
  if(sel.resumen) dss.push(dsResumen(d1,d2));
  if(sel.gastos) dss.push(dsGastos(S.gastos.filter(g=>enRango(g.fecha,d1,d2))));
  if(sel.nomina) dss.push(dsNomina(d1,d2));
  if(sel.asistencia) dss.push(...dsAsistencia(d1,d2));
  if(sel.obras) dss.push(dsObras(d1,d2));
  if(sel.empleados) dss.push(dsEmpleados());
  if(sel.suplidores) dss.push(dsSuplidores());
  if(sel.notas) dss.push(dsNotas(d1,d2));
  if(!dss.length) return toast('Marca al menos una cosa para exportar');
  const nombre=`Obras_${d1||'inicio'}_a_${d2||hoy()}`;
  if(formato==='pdf') await crearPDF(dss,'Reporte',textoPeriodo(d1,d2),nombre+'.pdf');
  else await crearExcel(dss,nombre+'.xlsx');
  cerrar();
}
async function exportarFiltrado(formato){
  const gs=gastosFiltrados();
  if(!gs.length) return toast('No hay gastos para exportar');
  const f=S.f, partes=[];
  if(f.tipo) partes.push(f.tipo==='obra'?'Gastos de obras':'Gastos personales');
  if(f.obra) partes.push('Obra: '+nomObra(f.obra));
  if(f.desde||f.hasta) partes.push(textoPeriodo(f.desde,f.hasta));
  if(f.q) partes.push('Búsqueda: '+f.q);
  const nombre=`Gastos_${hoy()}`;
  if(formato==='pdf') await crearPDF([dsGastos(gs)],'Reporte de gastos',partes.join('   |   ')||'Todos los gastos',nombre+'.pdf');
  else await crearExcel([dsGastos(gs)],nombre+'.xlsx');
}
const filaTotal = ds => ds.h.map((_,i)=> i===0 ? 'Total' : (ds.sum||[]).includes(i) ? r2(sum(ds.rows,r=>r[i])) : '');
async function crearExcel(dss,nombre){
  const wb=XLSX.utils.book_new();
  for(const ds of dss){
    const aoa=[ds.h,...ds.rows]; if(ds.sum&&ds.rows.length) aoa.push(filaTotal(ds));
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=ds.h.map((k,i)=>({wch:Math.min(45,Math.max(...aoa.map(r=>String(r[i]??'').length))+2)}));
    XLSX.utils.book_append_sheet(wb,ws,ds.t.slice(0,31));
  }
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  await descargar(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),nombre);
}
async function crearPDF(dss,titulo,sub,nombre){
  if(!window.jspdf) return toast('No se pudo cargar el generador de PDF. Revisa la conexión.');
  const doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'letter'});
  const alto=doc.internal.pageSize.getHeight(), ancho=doc.internal.pageSize.getWidth();
  doc.setFontSize(14); doc.text(titulo,14,14);
  doc.setFontSize(9); doc.text(sub+'   |   Generado el '+fecha(hoy()),14,20);
  let y=28;
  for(const ds of dss){
    const cols=ds.pdf||ds.h.map((_,i)=>i), nums=ds.num||[];
    if(y>alto-40){ doc.addPage(); y=16; }
    doc.setFontSize(11); doc.text(`${ds.t} (${ds.rows.length})`,14,y);
    const cel=(v,i)=>nums.includes(i)?fmtN(v):String(v??'');
    const colStyles={}; cols.forEach((i,j)=>{ if(nums.includes(i)) colStyles[j]={halign:'right'}; });
    doc.autoTable({
      startY:y+2,
      head:[cols.map(i=>ds.h[i])],
      body:ds.rows.length ? ds.rows.map(r=>cols.map(i=>cel(r[i],i))) : [[{content:'Sin datos en este período',colSpan:cols.length}]],
      foot:(ds.sum&&ds.rows.length) ? [cols.map((i,j)=>j===0?'Total':ds.sum.includes(i)?fmtN(sum(ds.rows,r=>r[i])):'')] : [],
      showFoot:'lastPage',
      styles:{fontSize:8,cellPadding:1.5},
      headStyles:{fillColor:[31,58,95]},
      footStyles:{fillColor:[232,238,246],textColor:20,fontStyle:'bold'},
      columnStyles:colStyles,
      margin:{left:14,right:14}
    });
    y=doc.lastAutoTable.finalY+12;
  }
  const n=doc.internal.getNumberOfPages();
  for(let p=1;p<=n;p++){ doc.setPage(p); doc.setFontSize(8); doc.text(`Página ${p} de ${n}`,ancho-34,alto-8); }
  await descargar(doc.output('blob'),nombre);
}
async function descargar(blob,nombre){
  if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) && navigator.canShare){
    const file=new File([blob],nombre,{type:blob.type});
    if(navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title:nombre}); return; }
      catch(e){ if(e.name==='AbortError') return; }
    }
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nombre;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
}
